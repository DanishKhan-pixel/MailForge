version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mailforge
      POSTGRES_PASSWORD: mailforge
      POSTGRES_DB: mailforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailforge -d mailforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
